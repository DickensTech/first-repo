

{% extends "cafe_base.html" %}

{% block title %}Place Your Order{% endblock %}

{% block content %}
<main class="order-page">
    <!-- Heading -->
    <section class="heading">
        <h1>Place Your Order</h1>
        <p>Enjoy your favourite meals from our restaurant.</p>
    </section>

    <!-- Order Form -->
    <div class="order-container">

        <h2>Customer Details</h2>

        <form id="orderForm">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="e.g. 0712345678"
                required
            >

            <label for="service">Order Type</label>
            <select id="service" name="service" required>
                <option value="">Select an option</option>
                <option value="Delivery">Delivery</option>
                <option value="Pickup">Pickup</option>
            </select>

            <label for="address">Delivery Address</label>
            <input
                type="text"
                id="address"
                name="address"
                placeholder="Enter your delivery address"
            >

            <h2 class="food-heading">Select Your Food</h2>

            <div class="food-item">

                <select class="food" onchange="calculateTotal()">
                    <option value="">Select food</option>
                    {% for item in menu_items %}
                    <option value="{{ item['id'] }}" data-price="{{ item['price'] }}"
                        {% if item['name'] == selected_food %}selected{% endif %}>
                        {{ item['name'] }} - KSh {{ item['price']|int }}
                    </option>
                    {% endfor %}
                </select>

                <input
                    type="number"
                    class="quantity"
                    value="1"
                    min="1"
                    onchange="calculateTotal()"
                >

            </div>

            <div id="extraItems"></div>

            <button type="button" class="add-btn" onclick="addFoodItem()">
                + Add Another Item
            </button>

            <label for="instructions">Special Instructions</label>
            <textarea
                id="instructions"
                name="instructions"
                placeholder="Any special requests?">
            </textarea>

            <div class="total">
                Total: KSh <span id="total">0</span>
            </div>

            <button type="submit" class="submit-btn">
                Place Order
            </button>

            <script>
                document.addEventListener("DOMContentLoaded", function () {
                    calculateTotal();
                });
            </script>

        </form>

    </div>
    </main>

{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/order.js') }}"></script>
{% endblock %}
